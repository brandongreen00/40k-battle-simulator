name: Simulate battles

# One artifact contract, three executors (brief §11): this workflow runs the
# same CLI a laptop would, and commits the same JSON the Pages app reads.
# Dispatchable from the Auto Player tab with a fine-grained token.

on:
  workflow_dispatch:
    inputs:
      army_a:
        description: Army A (name as listed by `python3 -m sim2.cli armies`; display label when army_a_json is set)
        required: true
        default: Imperialis Fleet Patrol
      army_b:
        description: Army B
        required: true
        default: Grizzled Company Line
      army_a_json:
        description: Optional named-list payload JSON for A (a List Builder saved list, sent by the Auto Player tab) — overrides army_a
        required: false
        default: ''
      army_b_json:
        description: Optional named-list payload JSON for B — overrides army_b
        required: false
        default: ''
      games:
        description: Number of games
        required: true
        default: '20'
      battle_size:
        description: Points (500 / 1000 / 2000)
        required: true
        default: '1000'
      seed:
        description: Base seed
        required: true
        default: '1'
      agent_a:
        description: Agent for A (random / heuristic / search)
        required: true
        default: heuristic
      agent_b:
        description: Agent for B
        required: true
        default: heuristic

permissions:
  contents: write

concurrency:
  group: sim-results
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # chunked well inside the 6-hour job limit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # A dispatched saved list arrives as JSON in the inputs; it is written to a
      # file through env vars (never shell-interpolated) and handed to the CLI as
      # a path — sim2.cli resolves unit names against the snapshot and refuses
      # the run if any unit does not resolve.
      - name: Materialise dispatched army payloads
        if: inputs.army_a_json != '' || inputs.army_b_json != ''
        env:
          ARMY_A_JSON: ${{ inputs.army_a_json }}
          ARMY_B_JSON: ${{ inputs.army_b_json }}
        run: |
          mkdir -p /tmp/dispatch
          [ -z "$ARMY_A_JSON" ] || printf '%s' "$ARMY_A_JSON" > /tmp/dispatch/army_a.sim2list.json
          [ -z "$ARMY_B_JSON" ] || printf '%s' "$ARMY_B_JSON" > /tmp/dispatch/army_b.sim2list.json

      - name: Run the batch
        env:
          A_ARG: ${{ inputs.army_a_json != '' && '/tmp/dispatch/army_a.sim2list.json' || inputs.army_a }}
          B_ARG: ${{ inputs.army_b_json != '' && '/tmp/dispatch/army_b.sim2list.json' || inputs.army_b }}
        run: |
          python3 -m sim2.cli batch \
            --a "$A_ARG" \
            --b "$B_ARG" \
            --games "${{ inputs.games }}" \
            --battle-size "${{ inputs.battle_size }}" \
            --seed "${{ inputs.seed }}" \
            --agent-a "${{ inputs.agent_a }}" \
            --agent-b "${{ inputs.agent_b }}" \
            --out results

      - name: Publish artifacts to the site
        run: python3 tools2/sync_results.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results public/results
          if git diff --staged --quiet; then
            echo "no result changes"
          else
            git commit -m "Simulate ${{ inputs.army_a }} vs ${{ inputs.army_b }} (${{ inputs.games }} games)"
            git push
          fi
